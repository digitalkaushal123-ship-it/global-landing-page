  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      color: #fff;
      background: radial-gradient(circle at top right, #1b3049, #07101d 55%, #03070d);
      min-height: 100vh;
    }

    .container {
      width: min(420px, 90%);
      margin: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 0;
      border-bottom: 1px solid #40351e;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border: 1px solid rgba(243,199,102,.9);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #f3c766;
      background: radial-gradient(circle at 30% 25%, #263b53, #08111e 72%);
      box-shadow: 0 0 22px rgba(243,199,102,.16), inset 0 0 14px rgba(243,199,102,.08);
      flex: 0 0 auto;
    }
    .logo svg { width: 43px; height: 43px; display: block; filter: drop-shadow(0 0 5px rgba(243,199,102,.35)); }

    .brand h2 {
      color: #f3c766;
      letter-spacing: 4px;
      font-size: 25px;
    }

    .brand p { display: none; }

    .contact-link {
      color: #f3c766;
      text-decoration: none;
      border: 1px solid #b68a36;
      padding: 10px 16px;
      border-radius: 30px;
    }

    .hero {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      text-align: center;
      gap: 10px;
      padding: 26px 0 30px;
    }
    .hero > div:first-child { width: 100%; }
    .description { margin: 0 auto 22px; font-size: 15px; line-height: 1.65; }
    h1 { font-size: clamp(30px, 8.5vw, 40px); margin: 17px 0 16px; line-height: 1.12; }
    .tag { font-size: 10px; padding: 7px 12px; letter-spacing: 1.5px; }
    .globe-area { min-height: 0; margin-bottom: 8px; }
    .globe { width: 148px; }
    .whatsapp { width: 100%; padding: 16px 14px; font-size: 15px; border-radius: 11px; }
    .note { margin-top: 10px; font-size: 11px; }

    .tag {
      display: inline-block;
      color: #f3c766;
      border: 1px solid #80652f;
      border-radius: 30px;
      padding: 9px 14px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.05;
      margin: 25px 0 20px;
    }

    h1 span { color: #f3c766; }

    .description {
      color: #bac5d4;
      font-size: 17px;
      line-height: 1.8;
      max-width: 530px;
      margin-bottom: 28px;
    }

    .whatsapp {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 18px 25px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 12px;
      box-shadow: 0 8px 28px #16a34a35;
      transition: .2s;
    }

    .whatsapp:hover {
      background: #12833d;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 14px;
      color: #8996a8;
      font-size: 12px;
    }

    .globe-area {
      display: grid;
      place-items: center;
      min-height: 300px;
    }

    .globe {
      width: min(280px, 70vw);
      aspect-ratio: 1;
      border: 1px solid rgba(243,199,102,.9);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #f3c766;
      background: radial-gradient(circle at 35% 25%, #293e57 0%, #101e30 52%, #07101d 78%);
      box-shadow: 0 0 75px rgba(243,199,102,.12), inset 0 0 42px rgba(243,199,102,.08);
      animation: globeFloat 6s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .globe::before {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(243,199,102,.38);
      border-radius: 50%;
      transform: rotate(-24deg) scaleX(.46);
    }
    .globe svg { width: 68%; height: 68%; overflow: visible; filter: drop-shadow(0 0 9px rgba(243,199,102,.28)); }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 28px;
    }

    .feature {
      padding: 25px;
      border: 1px solid #3a3325;
      background: #0c1929;
      border-radius: 16px;
    }

    .feature .icon {
      color: #f3c766;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .feature h3 { margin-bottom: 10px; }

    .feature p {
      color: #bac5d4;
      font-size: 14px;
      line-height: 1.7;
    }

    .contact-box {
      border: 1px solid #69532c;
      background: #111c2b;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 45px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .contact-box h2 { margin-bottom: 10px; }
    .gold { color: #f3c766; }

    .contact-box p {
      color: #bac5d4;
      line-height: 1.6;
    }

    footer {
      border-top: 1px solid #40351e;
      padding: 23px 0;
      color: #8996a8;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Polished motion and touch-friendly responsive layout */
    body { overflow-x: hidden; }
    header, .hero, .feature, .contact-box { animation: fadeUp .75s ease both; }
    .hero { animation-delay: .08s; }
    .globe-area { animation: fadeUp .9s .12s ease both; }
    .feature { transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
    .feature:hover { transform: translateY(-5px); border-color: rgba(243,199,102,.65); box-shadow: 0 12px 30px rgba(0,0,0,.18); }
    .contact-link { transition: background .2s ease, box-shadow .2s ease, transform .2s ease; }
    .contact-link:hover { background: rgba(243,199,102,.1); box-shadow: 0 0 18px rgba(243,199,102,.12); transform: translateY(-1px); }
    .whatsapp { transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
    .whatsapp:hover { box-shadow: 0 10px 34px rgba(22,163,74,.28); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes globeFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 700px) {
      .brand h2 { font-size: 23px; letter-spacing: 5px; }
      .brand p { font-size: 8px; letter-spacing: 1px; }
      .logo { width: 46px; height: 46px; } .logo svg { width: 35px; height: 35px; }
      .contact-link { font-size: 12px; padding: 9px 11px; }

      .hero {
        flex-direction: column-reverse;
        padding: 24px 0 28px;
        gap: 8px;
      }
      h1 { font-size: clamp(34px, 10vw, 52px); overflow-wrap: anywhere; }
      .description { font-size: 16px; line-height: 1.75; }
      .container { width: min(1100px, 90%); }
      header { gap: 12px; }
      .brand { min-width: 0; gap: 9px; }
      .brand h2 { letter-spacing: 3px; }
      .contact-link { white-space: nowrap; }

      .globe-area { min-height: 0; margin-bottom: 8px; }
      .globe { width: min(148px, 42vw); }

      .features { grid-template-columns: 1fr; }
      .contact-box {
        flex-direction: column;
        align-items: stretch;
        padding: 23px;
      }

      .whatsapp { width: 100%; }
    }
